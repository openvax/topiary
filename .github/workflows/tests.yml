# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      HAS_NETMHC_TOKEN: ${{ secrets.NETMHC_BUNDLE_ACCESS_TOKEN != '' }}
      # Pin pyensembl's data directory rather than trusting its default.
      # The cache below is only useful if it names the directory pyensembl
      # actually writes to, and "~/.pyensembl" was not it.
      PYENSEMBL_CACHE_DIR: ${{ github.workspace }}/pyensembl-data
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Cache pyensembl data
        id: ensembl-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/pyensembl-data
          key: pyensembl-GRCh37.75-GRCm38.102-GRCh38.93-GRCm38.93-v2
      - name: Checkout private netmhc-bundle repo
        if: env.HAS_NETMHC_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: openvax/netmhc-bundle
          token: ${{ secrets.NETMHC_BUNDLE_ACCESS_TOKEN }}
          path: netmhc-bundle

      - name: Install netmhc-bundle dependencies
        if: env.HAS_NETMHC_TOKEN == 'true'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tcsh gawk
          version: 1.0
      - name: Verify netmhc-bundle tools
        if: env.HAS_NETMHC_TOKEN == 'true'
        run: |
          export NETMHC_BUNDLE_HOME=$PWD/netmhc-bundle
          mkdir -p $PWD/netmhc-bundle-tmp
          export NETMHC_BUNDLE_TMPDIR=$PWD/netmhc-bundle-tmp
          export PATH=$PATH:$NETMHC_BUNDLE_HOME/bin
          echo `which netMHC` && netMHC -h
          echo `which netMHCpan` && netMHCpan -h
          echo `which netMHCcons` && netMHCcons -h
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov ruff
          python -m pip install -e .
      - name: Verify PirlyGenes is absent from the base environment
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('pirlygenes') is None, 'base CI unexpectedly installed PirlyGenes'"
      - name: Lint with ruff
        run: |
          ./lint.sh
      - name: Download Ensembl data
        if: steps.ensembl-cache.outputs.cache-hit != 'true'
        run: |
          echo "Before installing Ensembl releases" && df -h
          # Four downloads from one host, each fatal to the whole build.
          # Retry with backoff: the failures seen in practice are 504s and
          # transient DNS, both of which a second attempt clears.
          install_release() {
            local attempt
            for attempt in 1 2 3; do
              if pyensembl install --release "$1" --species "$2" \
                  --custom-mirror "$3"; then
                return 0
              fi
              echo "::warning::pyensembl install $2 $1 failed (attempt $attempt/3)"
              sleep $((attempt * 15))
            done
            echo "::error::pyensembl install $2 $1 failed after 3 attempts"
            return 1
          }
          BASE=https://github.com/openvax/ensembl-data/releases/download
          install_release 75  human "$BASE/GRCh37.75/"
          install_release 102 mouse "$BASE/GRCm38.102/"
          install_release 93  human "$BASE/GRCh38.93/"
          install_release 93  mouse "$BASE/GRCm38.93/"
      - name: Verify Ensembl data is present
        run: |
          # Fail loudly if the directory is empty. The previous cache step
          # pointed at a path pyensembl never wrote to and silently saved
          # nothing for months; a cache that stops working should break the
          # build, not quietly restore the every-run download it replaced.
          if [ -z "$(ls -A "$PYENSEMBL_CACHE_DIR" 2>/dev/null)" ]; then
            echo "::error::PYENSEMBL_CACHE_DIR ($PYENSEMBL_CACHE_DIR) is empty"
            exit 1
          fi
          echo "Ensembl data in $PYENSEMBL_CACHE_DIR:"
          du -sh "$PYENSEMBL_CACHE_DIR"
      - name: Test with pytest
        if: env.HAS_NETMHC_TOKEN == 'true'
        run: |
          # configure netmhc-bundle paths
          export NETMHC_BUNDLE_HOME=$PWD/netmhc-bundle
          echo "NetMHC-bundle dir:" && ls -l $NETMHC_BUNDLE_HOME
          mkdir -p $PWD/netmhc-bundle-tmp
          export NETMHC_BUNDLE_TMPDIR=$PWD/netmhc-bundle-tmp
          export PATH=$PATH:$NETMHC_BUNDLE_HOME/bin
          ./test.sh
      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@v2.2.3
        with:
          parallel: true
          flag-name: python-${{ matrix.python-version }}

  pirlygenes-integration:
    needs: build
    runs-on: ubuntu-22.04
    env:
      PYENSEMBL_CACHE_DIR: ${{ github.workspace }}/pyensembl-data
      TOPIARY_TEST_REQUIRE_PIRLYGENES: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Restore Ensembl data from the base jobs
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/pyensembl-data
          key: pyensembl-GRCh37.75-GRCm38.102-GRCh38.93-GRCm38.93-v2
          fail-on-cache-miss: true
      - name: Install Topiary with PirlyGenes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-xdist
          python -m pip install -e '.[pirlygenes]'
      - name: Verify PirlyGenes imports
        run: |
          python -c "from importlib.metadata import version; import pirlygenes; print('PirlyGenes', version('pirlygenes'))"
      - name: Test PirlyGenes integration
        run: |
          ./test.sh -m pirlygenes --strict-markers

  packaging:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
      - name: Check distribution contents and metadata
        run: |
          python tests/check_distributions.py dist
          python -m twine check --strict dist/*

  coveralls-finish:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Finalize Coveralls
        uses: coverallsapp/github-action@v2.2.3
        with:
          parallel-finished: true
