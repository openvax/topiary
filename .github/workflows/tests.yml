# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests
on: [push, pull_request]

jobs:
  vaxrank-candidate-workflow:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the pinned downstream fixture migration
        # Released Vaxrank 3.20.1 pins Osteosarc 0.1.2. The matching migration
        # in openvax/vaxrank#503 needs this Topiary release first; pin its exact
        # reviewed commit so pip validates a compatible dependency set.
        run: python -m pip install pytest 'vaxrank @ git+https://github.com/openvax/vaxrank.git@616dd08496ab4f67ca18732aa53a435ff27625c1' -e .
      - name: Verify table features through DSL scoring and vaccine construction
        run: python -m pytest scripts/check_vaxrank_candidates.py -q

  build:
    runs-on: ubuntu-22.04
    outputs:
      coverage-jobs: ${{ strategy.job-total }}
      ensembl-cache-key: ${{ steps.ensembl-release.outputs.cache-key }}
    env:
      HAS_NETMHC_TOKEN: ${{ secrets.NETMHC_BUNDLE_ACCESS_TOKEN != '' }}
      # Pin pyensembl's data directory rather than trusting its default.
      # The cache below is only useful if it names the directory pyensembl
      # actually writes to, and "~/.pyensembl" was not it.
      PYENSEMBL_CACHE_DIR: ${{ github.workspace }}/pyensembl-data
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Checkout private netmhc-bundle repo
        if: env.HAS_NETMHC_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          repository: openvax/netmhc-bundle
          token: ${{ secrets.NETMHC_BUNDLE_ACCESS_TOKEN }}
          path: netmhc-bundle

      - name: Install netmhc-bundle dependencies
        if: env.HAS_NETMHC_TOKEN == 'true'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tcsh gawk
          version: 1.0
      - name: Verify netmhc-bundle tools
        if: env.HAS_NETMHC_TOKEN == 'true'
        run: |
          export NETMHC_BUNDLE_HOME=$PWD/netmhc-bundle
          mkdir -p $PWD/netmhc-bundle-tmp
          export NETMHC_BUNDLE_TMPDIR=$PWD/netmhc-bundle-tmp
          export PATH=$PATH:$NETMHC_BUNDLE_HOME/bin
          echo `which netMHC` && netMHC -h
          echo `which netMHCpan` && netMHCpan -h
          echo `which netMHCcons` && netMHCcons -h
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov ruff
          python -m pip install -e .
      - name: Resolve the installed default Ensembl release
        id: ensembl-release
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pyensembl import ensembl_grch38
          release = ensembl_grch38.release
          print(f"release={release}")
          print(f"cache-key=pyensembl-GRCh37.75-GRCh38.{release}-v4")
          PY
      - name: Cache pyensembl data
        id: ensembl-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/pyensembl-data
          key: ${{ steps.ensembl-release.outputs.cache-key }}
          restore-keys: pyensembl-GRCh37.75-GRCm38.102-GRCh38.93-GRCm38.93-v2
      - name: Verify PirlyGenes is absent from the base environment
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('pirlygenes') is None, 'base CI unexpectedly installed PirlyGenes'"
      - name: Verify Isovar is absent from the base environment
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('isovar') is None, 'base CI unexpectedly installed Isovar'"
      - name: Install samtools for Osteosarc extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools
      - name: Verify Osteosarc is installed in the base environment
        run: |
          python -c "from importlib.metadata import version; import osteosarc, pysam; print('Osteosarc', version('osteosarc'))"
      - name: Lint with ruff
        run: |
          ./lint.sh
      - name: Download Ensembl data
        if: steps.ensembl-cache.outputs.cache-hit != 'true'
        run: |
          echo "Before installing Ensembl releases" && df -h
          # GRCh37 fixtures use the mirror; the dependency-selected GRCh38
          # default uses Ensembl itself and belongs in the cache key. The
          # suite uses no downloaded mouse or release-93 annotation.
          # Retry with backoff: the failures seen in practice are 504s and
          # transient DNS, both of which a second attempt clears.
          install_release() {
            local attempt
            local mirror_args=()
            if [ -n "$3" ]; then
              mirror_args=(--custom-mirror "$3")
            fi
            for attempt in 1 2 3; do
              if pyensembl install --release "$1" --species "$2" \
                  "${mirror_args[@]}"; then
                return 0
              fi
              echo "::warning::pyensembl install $2 $1 failed (attempt $attempt/3)"
              sleep $((attempt * 15))
            done
            echo "::error::pyensembl install $2 $1 failed after 3 attempts"
            return 1
          }
          BASE=https://github.com/openvax/ensembl-data/releases/download
          install_release 75  human "$BASE/GRCh37.75/"
          install_release '${{ steps.ensembl-release.outputs.release }}' human ""
      - name: Verify Ensembl data is present
        run: |
          # A nonempty cache may contain only obsolete releases. Exercise
          # the actual default reference after both cache hits and installs.
          python scripts/check_default_ensembl.py
      - name: Test with pytest
        if: env.HAS_NETMHC_TOKEN == 'true'
        run: |
          # configure netmhc-bundle paths
          export NETMHC_BUNDLE_HOME=$PWD/netmhc-bundle
          echo "NetMHC-bundle dir:" && ls -l $NETMHC_BUNDLE_HOME
          mkdir -p $PWD/netmhc-bundle-tmp
          export NETMHC_BUNDLE_TMPDIR=$PWD/netmhc-bundle-tmp
          export PATH=$PATH:$NETMHC_BUNDLE_HOME/bin
          ./test.sh
      - name: Save coverage for the upload job
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          # A retried matrix member replaces only its own data. Successful
          # members' artifacts remain available on a failed-jobs-only rerun.
          overwrite: true

  pirlygenes-integration:
    needs: build
    runs-on: ubuntu-22.04
    env:
      PYENSEMBL_CACHE_DIR: ${{ github.workspace }}/pyensembl-data
      TOPIARY_TEST_REQUIRE_PIRLYGENES: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Restore Ensembl data from the base jobs
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/pyensembl-data
          key: ${{ needs.build.outputs.ensembl-cache-key }}
          fail-on-cache-miss: true
      - name: Install Topiary with PirlyGenes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-xdist
          python -m pip install -e '.[pirlygenes]'
      - name: Verify PirlyGenes imports
        run: |
          python -c "from importlib.metadata import version; import pirlygenes; print('PirlyGenes', version('pirlygenes'))"
      - name: Test PirlyGenes integration
        run: |
          ./test.sh -m pirlygenes --strict-markers

  isovar-integration:
    runs-on: ubuntu-22.04
    env:
      TOPIARY_TEST_REQUIRE_ISOVAR: "1"
      PYENSEMBL_CACHE_DIR: ${{ github.workspace }}/empty-ensembl-cache
    strategy:
      fail-fast: false
      matrix:
        isovar: ["isovar==1.37.0", "isovar<2"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install Topiary with Isovar (minimum and latest)
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-xdist
          python -m pip install -e '.[isovar]' '${{ matrix.isovar }}'
      - name: Verify Isovar imports
        run: |
          python -c "import sys; from importlib.metadata import version; import topiary; assert 'isovar' not in sys.modules; import isovar; print('Isovar', version('isovar'))"
      - name: Test Isovar integration
        run: |
          ./test.sh -m 'isovar or osteosarc' --strict-markers

  packaging:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
      - name: Check distribution contents and metadata
        run: |
          python tests/check_distributions.py dist
          python -m twine check --strict dist/*

  coverage:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download successful matrix coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-python-*
          path: coverage-data
      - name: Combine the complete test matrix
        env:
          EXPECTED_COVERAGE_JOBS: ${{ needs.build.outputs.coverage-jobs }}
        run: |
          python -m pip install coverage
          python tests/combine_coverage.py coverage-data "$EXPECTED_COVERAGE_JOBS" coverage.xml
      - name: Install verified Coveralls reporter
        run: |
          # Pin the release and its published binary digest together. Avoid
          # racing separate "latest" archive and checksum downloads.
          bash scripts/download_verified.sh \
            https://github.com/coverallsapp/coverage-reporter/releases/download/v0.6.22/coveralls-linux-x86_64 \
            34fcaf347627307e505ec207acd617c3bfc6c3e2684b22e760be29eb339c36d5 \
            "$RUNNER_TEMP/coveralls"
          chmod +x "$RUNNER_TEMP/coveralls"
      - name: Publish coverage to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One non-parallel report: no finish webhook can close a build while
          # other jobs still need it. Give every rerun a distinct build number.
          "$RUNNER_TEMP/coveralls" report coverage.xml --format=cobertura \
            --build-number="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
