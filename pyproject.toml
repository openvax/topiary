[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "topiary"
requires-python = ">=3.11"
authors = [{name = "Alex Rubinsteyn"}, {name = "Tavi Nathanson"}]
description = "Predict, filter, and rank MHC-presented peptides from any antigen source"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = {attr = "topiary.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["topiary", "topiary.*"]
namespaces = false

[tool.setuptools.package-data]
topiary = ["py.typed"]

[project.urls]
"Homepage" = "https://github.com/openvax/topiary"
"Bug Tracker" = "https://github.com/openvax/topiary/issues"

[project.scripts]
topiary = "topiary.cli.script:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
# E721 flags `dtype == object`, which is the correct test for a numpy dtype.
ignore = ["E501", "E721"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test*/*" = ["F401"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
    "weirdo: exercises the installed WEIRDO model integration",
    "isovar: exercises RNA assembly with Isovar",
    "pirlygenes: exercises CTA and expression sources with PirlyGenes",
    "osteosarc: exercises Osteosarc data acquisition and shared fixtures",
    "netmhc: requires the private NetMHC bundle executables",
]

[tool.mypy]
files = ["topiary", "tests/typing"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Upstream dependencies that do not yet publish type information or py.typed.
# Declared narrowly here so import sites stay free of per-line ignores.
[[tool.mypy.overrides]]
module = [
    "gtfparse", "gtfparse.*",
    "mhcgnomes", "mhcgnomes.*",
    "mhctools", "mhctools.*",
    "osteosarc", "osteosarc.*",
]
ignore_missing_imports = true
